<section class="contact-section">

    <h1>
        Contact Us
    </h1>


    <p>
        We'd love to hear from you!
    </p>


    <div class="contact-info">

    <h3>
        📍 Location
    </h3>

    <p>
        Tayabas City, Philippines
    </p>


    <h3>
        📞 Phone
    </h3>

    <p>
        <a href="tel:09569604075">
            0956-960-4075
        </a>
    </p>


    <div class="contact-facebook">

    <img
        src="images\fb.avif"
        alt="Facebook Logo"
        width="100"
    >

    <p>
        <a href="https://www.facebook.com/ChickNThaits"
           target="_blank"
           rel="noopener noreferrer">
            Visit our Facebook Page
        </a>
    </p>

</div>
</div>



    <form id="feedback-form">

    <input
        type="text"
        id="feedback-name"
        placeholder="Your Name"
        required
    >

    <h3>How was your experience?</h3>

    <select id="feedback-rating" required>
        <option value="">Select your rating</option>
        <option value="Excellent">⭐⭐⭐⭐⭐ Excellent</option>
        <option value="Good">⭐⭐⭐⭐ Good</option>
        <option value="Average">⭐⭐⭐ Average</option>
        <option value="Poor">⭐⭐ Poor</option>
        <option value="Very Poor">⭐ Very Poor</option>
    </select>

    <textarea
        id="feedback-message"
        placeholder="Write your feedback or suggestions..."
        rows="5"
        required
    ></textarea>
    <h3>Attach an Image (Optional)</h3>

<input
    type="file"
    id="feedback-image"
    accept="image/png, image/jpeg, image/jpg, image/webp"
>

<div id="image-preview-container">
    <img id="image-preview" alt="Feedback image preview">
</div>

    <button type="submit" class="cart-button">
        Submit Feedback
    </button>

</form>
